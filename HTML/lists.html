<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <h1 align="center">List in HTML</h1>


    <!-- UL : Unorderd List -->
     <h6>Unordered List</h6> <!-- we can get type of bulletin shape by writing it in type=" shape "-->
     <ul type="square">
        <!--li : list items -->
        <li>English</li>
        <ol>
            <li>Grammar</li> <!-- ol withing ul-->
            <li>Literature</li>
            <li>Poem</li>   
        </ol>
        <li>Maths</li>
        <li>Social Science</li>
     </ul>
     <h6>Ordered list</h6>
     <!-- OL : Ordered list, within <ol> we can write reversed to get reversed number order/ Or we can start from nth number if we want writing start="N" -->
      <ol start="8" type="I"> <!-- we can get different type of order like ROMAN, Lower/Upper Alphabets, etc using type=" "-->
        <li>Computer Architeture</li>
        <li>OOP</li>
        <ul>
            <li>c++</li>
            <li>java</li>
        </ul>
        <li>Data Structure</li>
      </ol>


<!-- Defination List : dt and dd -->
 <h6>Defination List</h6>
 <dt>
    HTML
 </dt>
 <dd>Hyper text Markup Language</dd>
 
 <dt>CSS</dt>
 <dd>Cascading Style Sheet</dd>

 <dt>JS</dt>
 <dd>JavaScript</dd>


</body>
</html>
