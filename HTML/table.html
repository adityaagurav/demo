   <!-- 
            tr: Table Row. This tag creates a new row in the table.
            th: Table Header. This creates a header cell, typically for a column title. The text is usually bold and centered.
            td: Table Data. This creates a standard data cell for content within a row.
        -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- to give border to it we write border=" " inside our table tag -->
    <table border="">
        <caption>this is a table caption</caption>
        <colgroup> 
            <!-- col style = " background-color: color ; will give color to our table, and using span tag span="n" it will color those tags -->
            <col span="4" style="background-color: antiquewhite;">
        </colgroup>
        <thead>    <!--tr: table row -->
        <!-- th: tag is bold -->
        <tr>
            <th>col-1</th>
            <th>col-2</th>
            <th>col-3</th>
            <th>col-4</th>
        </tr>
        </thead>

        <tbody>
             <tr>
            <!-- td : table column -->
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr> 
            <!-- td>td*5 is emmet abbrivation shortcut to get multiple colums -->
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>abc</td>
                <td>def</td>
                <td>ghi</td>
                <td>ijk</td>
            </tr>
        </tfoot>

    

       
    </table>
</body>
</html>
